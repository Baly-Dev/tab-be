[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tab-be"
version = "0.1.0"
description = "Tab backend API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "boto3>=1.44.9",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "passlib>=1.9.5",
    "redis>=8.2.0",
    "segno>=1.6.6",
    "sentry-sdk>=3.0.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
    "ruff>=0.17.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["admin*", "auth*", "core*", "config*", "notifications*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
