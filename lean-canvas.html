<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FlashTable — Lean Business Model Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="lean-canvas.css" />
</head>
<body>
<main class="sheet">
  <header class="titlebar">
    <button class="guide-btn" id="guide-open" type="button">Guida</button>
    <h1>Lean Business Model Canvas</h1>
    <p class="who" id="doc-title">FlashTable</p>
    <p class="dek" id="doc-dek"></p>
  </header>
  <div class="canvas" id="canvas"></div>
  <footer class="legend">
    <p class="legend-row"><span><span class="swatch"></span>Definito nel documento</span><span><span class="swatch dashed"></span>Da definire</span><span>Listini da verificare: nel file i prezzi sono ipotesi.</span></p>
    <p id="source-state">Lettura di BUSINESS_MODEL.md…</p>
  </footer>
</main>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <p class="kicker" id="drawer-kicker"></p>
    <h2 id="drawer-title"></h2>
    <div class="drawer-actions">
      <button class="mark-btn" id="drawer-mark" type="button" disabled>Sottolinea</button>
      <button class="close" id="drawer-close" type="button">Chiudi</button>
    </div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<script src="lean-canvas.js"></script>
</body>
</html>
